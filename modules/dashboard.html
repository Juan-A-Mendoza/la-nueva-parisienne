<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Gerencial - La Nueva Parisienne</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .module-container {
      padding: 2.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-surface);
      padding: 1.25rem 2rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-subtle);
      margin-bottom: 2rem;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .user-avatar {
      font-size: 2rem;
      background: var(--color-gold-light);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logout-btn {
      background: var(--gradient-espresso);
      color: var(--color-gold);
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-pill);
      font-weight: 600;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .kpi-card {
      background: var(--bg-surface);
      padding: 1.75rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-subtle);
      border-left: 5px solid var(--color-gold);
    }
    .kpi-value {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--color-espresso);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="module-container">
    <div class="top-bar">
      <div>
        <h1 class="brand-title" style="font-size: 1.8rem;">La Nueva Parisienne</h1>
        <p class="sub-title">Módulo 4: Dashboard Gerencial</p>
      </div>
      <div class="user-info">
        <div id="userAvatar" class="user-avatar">👨‍💼</div>
        <div>
          <h4 id="userName" style="color: var(--color-espresso);">Antoine Moreau</h4>
          <span id="userRole" style="font-size: 0.85rem; color: var(--color-gold-dark);">Gerente General</span>
        </div>
        <button id="logoutBtn" class="logout-btn">Cerrar Sesión</button>
      </div>
    </div>

    <div class="card-grid">
      <div class="kpi-card">
        <h3>Ventas del Día</h3>
        <div class="kpi-value">$1,485.50</div>
        <p style="color: var(--color-success); font-size: 0.9rem; margin-top: 0.4rem;">▲ +12.4% vs ayer</p>
      </div>
      <div class="kpi-card" style="border-left-color: var(--color-terracotta);">
        <h3>Hornos Activos</h3>
        <div class="kpi-value">3 / 4</div>
        <p style="color: var(--color-muted); font-size: 0.9rem; margin-top: 0.4rem;">Capacidad al 75%</p>
      </div>
      <div class="kpi-card" style="border-left-color: #2E7D32;">
        <h3>Alertas de Inventario</h3>
        <div class="kpi-value">2 Materias</div>
        <p style="color: var(--color-danger); font-size: 0.9rem; margin-top: 0.4rem;">Harina Mantequilla reposición</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { SessionStore } from '../js/core/session-store.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      const session = SessionStore.getSession();
      if (!session) {
        alert('Sesión no encontrada. Redirigiendo a autenticación...');
        window.location.href = '../index.html';
        return;
      }
      
      document.getElementById('userName').textContent = session.user.name;
      document.getElementById('userRole').textContent = session.user.role;
      document.getElementById('userAvatar').textContent = session.user.icon;
      
      document.getElementById('logoutBtn').addEventListener('click', () => {
        SessionStore.logout();
      });
    });
  </script>
</body>
</html>
