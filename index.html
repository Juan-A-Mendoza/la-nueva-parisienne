<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Nueva Parisienne - Inicio de Sesión</title>
  <meta name="description" content="Acceso al Sistema de Gestión, Contabilidad y Punto de Venta de La Nueva Parisienne.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/modules/auth.css">
</head>
<body>
  <main class="auth-wrapper">
    <!-- CABECERA DE LA MARCA -->
    <header class="auth-header">
      <div class="logo-badge" aria-hidden="true">
        <i data-lucide="croissant" class="icon-xl"></i>
      </div>
      <h1 class="brand-title">La Nueva Parisienne</h1>
      <p class="sub-title">Sistema de Gestión Gerencial, Contabilidad y Punto de Venta</p>
      <span class="academic-badge">Panadería &amp; Pastelería Artesanal</span>
    </header>

    <!-- TARJETA CLÁSICA DE INICIO DE SESIÓN -->
    <section class="auth-card-section" aria-label="Inicio de Sesión">
      <div class="login-card">
        <div class="login-card-header">
          <div class="login-avatar-icon" aria-hidden="true">
            <i data-lucide="shield-check" class="icon-lg"></i>
          </div>
          <h2 class="login-card-title">Iniciar Sesión</h2>
          <p class="login-card-subtitle">Ingrese sus credenciales de usuario para acceder al sistema</p>
        </div>

        <form id="classicLoginForm" class="login-form" autocomplete="on">
          <!-- ALERTA DE ERROR ACCESIBLE -->
          <div id="loginErrorAlert" class="login-error-alert" style="display: none;" role="alert"></div>

          <!-- CAMPO: USUARIO -->
          <div class="login-form-group">
            <label for="loginUsername" class="login-label">
              <i data-lucide="user" class="icon-xs"></i> Nombre de Usuario
            </label>
            <div class="input-with-icon-wrapper">
              <span class="input-icon-prefix" aria-hidden="true">
                <i data-lucide="at-sign" class="icon-sm"></i>
              </span>
              <input 
                type="text" 
                id="loginUsername" 
                name="username" 
                class="login-input with-prefix" 
                required 
                autocomplete="username" 
                placeholder="Ej. superadmin, admin, cajero..."
                autofocus
              >
            </div>
          </div>

          <!-- CAMPO: CONTRASEÑA -->
          <div class="login-form-group">
            <label for="loginPassword" class="login-label">
              <i data-lucide="lock" class="icon-xs"></i> Contraseña / Clave
            </label>
            <div class="input-with-icon-wrapper">
              <span class="input-icon-prefix" aria-hidden="true">
                <i data-lucide="key-round" class="icon-sm"></i>
              </span>
              <input 
                type="password" 
                id="loginPassword" 
                name="password" 
                class="login-input with-prefix with-suffix" 
                required 
                autocomplete="current-password" 
                placeholder="••••••••"
              >
              <button 
                type="button" 
                id="btnTogglePassword" 
                class="input-suffix-btn" 
                aria-label="Mostrar u ocultar contraseña" 
                title="Mostrar u ocultar contraseña"
              >
                <i data-lucide="eye" id="togglePasswordIcon" class="icon-sm"></i>
              </button>
            </div>
          </div>

          <!-- BOTÓN DE ENVÍO -->
          <button type="submit" id="loginSubmitBtn" class="btn-login-submit">
            <i data-lucide="log-in" class="icon-sm"></i>
            <span>Iniciar Sesión</span>
          </button>
        </form>
      </div>
    </section>

    <!-- PIE DE PÁGINA -->
    <footer class="auth-footer">
      <p>&copy; 2026 La Nueva Parisienne &mdash; Sistema de Gestión Integral &bull; Versión Empresarial</p>
    </footer>
  </main>

  <script src="js/vendor/lucide.min.js"></script>
  <script src="js/core/icons.js"></script>
  <script type="module" src="js/modules/auth.js"></script>
</body>
</html>
